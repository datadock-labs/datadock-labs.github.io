name: Firefox store link
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the Firefox link once Tidy Screenshot is public on AMO
        run: |
          out=$(bash scripts/firefox-link.sh)
          echo "$out"
          if echo "$out" | grep -q '^changed$'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -am "Tidy Screenshot: Firefox store link"
            git push
          fi
